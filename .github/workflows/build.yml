name: Clippers Live Hub CI and Windows build
on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.27"
          cache: true
      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test ./... -count=1 -timeout 10m
  windows:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.27"
          cache: true
      - name: Build Windows executable
        run: VERSION="${GITHUB_REF_NAME}" ./scripts/build-windows.sh
      - name: Upload Windows executable
        uses: actions/upload-artifact@v4
        with:
          name: Clippers-Live-Hub-Windows-amd64
          path: dist/ClippersLiveHub.exe
          if-no-files-found: error
          retention-days: 30
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [test, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.27"
          cache: true
      - name: Build Windows executable
        run: VERSION="${GITHUB_REF_NAME}" ./scripts/build-windows.sh
      - name: Publish Windows release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --generate-notes
          gh release upload "$TAG" dist/ClippersLiveHub.exe --clobber
