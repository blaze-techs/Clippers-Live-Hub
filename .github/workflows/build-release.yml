name: Build standalone Windows and Android packages
on:
  push:
    branches: [feature/auto-clipper]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    name: Windows standalone installer
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.x'
          cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test Go engine
        run: go test ./... -count=1
      - name: Build embedded Go engine
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force runtime/bin | Out-Null
          $env:GOOS = "windows"
          $env:GOARCH = "amd64"
          $env:CGO_ENABLED = "0"
          go build -trimpath -ldflags "-s -w" -o runtime/ClippersLiveHub.exe ./cmd/clipper
      - name: Install FFmpeg runtime
        shell: pwsh
        run: |
          choco install ffmpeg -y --no-progress
          # Chocolatey exposes shim executables on PATH. Bundle the real binaries,
          # not the shims, because the installed Chocolatey directory is not present
          # on end-user machines.
          $ffmpeg = Get-ChildItem "$env:ChocolateyInstall\lib\ffmpeg\tools" -Filter ffmpeg.exe -Recurse -File | Select-Object -First 1
          $ffprobe = Get-ChildItem "$env:ChocolateyInstall\lib\ffmpeg\tools" -Filter ffprobe.exe -Recurse -File | Select-Object -First 1
          if (-not $ffmpeg -or -not $ffprobe) { throw "FFmpeg/FFprobe binaries were not found in the Chocolatey package." }
          Copy-Item $ffmpeg.FullName runtime/bin/ffmpeg.exe
          Copy-Item $ffprobe.FullName runtime/bin/ffprobe.exe
          if (!(Test-Path runtime/bin/ffmpeg.exe)) { throw 'ffmpeg was not staged' }
          & runtime/ClippersLiveHub.exe -version
          & runtime/bin/ffmpeg.exe -version
      - name: Build desktop installer
        run: |
          npm install --no-audit --no-fund
          npm run build
          # CI detection makes electron-builder try to publish; the release
          # job in build.yml owns that, so keep this step to packaging only.
          npx electron-builder --win nsis --x64 --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: Clippers-Live-Hub-Windows-Standalone-Installer
          path: release/*.exe
          if-no-files-found: error
  android:
    name: Android APK package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'
      - name: Install Android platform and build tools
        run: yes | sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Install web dependencies
        run: npm install --no-audit --no-fund
      - name: Build and package Android app
        run: |
          npm run build
          npx cap add android
          npx cap sync android
      - name: Build APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: Clippers-Live-Hub-Android-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
