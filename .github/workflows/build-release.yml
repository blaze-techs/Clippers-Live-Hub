name: Build standalone Windows and Android packages
on:
  push:
    branches: [feature/auto-clipper]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    name: Windows standalone installer
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.x'
          cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test Go engine
        run: go test ./... -count=1
      - name: Build embedded Go engine
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force runtime/bin | Out-Null
          $env:GOOS = "windows"
          $env:GOARCH = "amd64"
          $env:CGO_ENABLED = "0"
          go build -trimpath -ldflags "-s -w" -o runtime/ClippersLiveHub.exe ./cmd/clipper
      - name: Install FFmpeg runtime
        shell: pwsh
        run: |
          choco install ffmpeg -y --no-progress
          # The chocolatey shim reports a path relative to its own directory,
          # so resolve the real binaries instead of trusting Get-Command.
          New-Item -ItemType Directory -Force runtime/bin | Out-Null
          $bin = Join-Path $env:ChocolateyInstall 'lib\ffmpeg\tools\ffmpeg\bin'
          if (!(Test-Path (Join-Path $bin 'ffmpeg.exe'))) {
            $found = Get-ChildItem (Join-Path $env:ChocolateyInstall 'lib\ffmpeg\tools') -Recurse -Filter ffmpeg.exe |
              Select-Object -First 1
            if (!$found) { throw 'ffmpeg.exe not found after install' }
            $bin = $found.DirectoryName
          }
          Copy-Item (Join-Path $bin 'ffmpeg.exe') runtime/bin/ffmpeg.exe -Force
          Copy-Item (Join-Path $bin 'ffprobe.exe') runtime/bin/ffprobe.exe -Force
          if (!(Test-Path runtime/bin/ffmpeg.exe)) { throw 'ffmpeg was not staged' }
          & runtime/ClippersLiveHub.exe -version
          & runtime/bin/ffmpeg.exe -version
      - name: Build desktop installer
        run: |
          npm install --no-audit --no-fund
          npm run build
          npx electron-builder --win nsis --x64
      - uses: actions/upload-artifact@v4
        with:
          name: Clippers-Live-Hub-Windows-Standalone-Installer
          path: release/*.exe
          if-no-files-found: error
  android:
    name: Android APK package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'
      - name: Install Android platform and build tools
        run: yes | sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Install web dependencies
        run: npm install --no-audit --no-fund
      - name: Build and package Android app
        run: |
          npm run build
          npx cap add android
          npx cap sync android
      - name: Build APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: Clippers-Live-Hub-Android-APK-WEB-SHELL
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
